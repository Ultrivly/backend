name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.98.1

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev libssl-dev libxml2-dev libxslt1-dev libxmlsec1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: No code comments
        run: |
          if grep -rnE '^\s*(//|--)' src tests migrations --include='*.rs' --include='*.sql'; then
            echo "Code comments are not allowed; explain decisions in ARCHITECTURE.md or docs/." && exit 1
          fi
      - name: OpenAPI document is current
        run: |
          python3 scripts/generate_openapi.py
          git diff --exit-code src/http/openapi.json

  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        postgres: ["15", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config clang libclang-dev libssl-dev libxml2-dev libxslt1-dev libxmlsec1-dev
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --locked
      - name: Migrations apply to an empty database
        run: |
          psql "$DATABASE_URL" -c "CREATE DATABASE migration_check"
          export DATABASE_URL=postgres://postgres:postgres@localhost:5432/migration_check
          cargo run --locked --quiet -- migrate
          cargo run --locked --quiet -- migrate status

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ultrivly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
